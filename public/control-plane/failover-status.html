<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Failover Gateway Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 30px; font-size: 28px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .card:hover { border-color: #475569; background: #334155; }
        .endpoint-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }
        .endpoint-info { flex: 1; }
        .endpoint-name { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
        .endpoint-url { font-size: 12px; color: #94a3b8; font-family: monospace; }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            display: inline-block;
        }
        .status-healthy { background: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .status-degraded { background: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
        .status-unhealthy { background: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        .status-text {
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }
        .metric {
            text-align: center;
        }
        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
        }
        .metric-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .audit-log {
            margin-top: 40px;
        }
        .audit-entry {
            background: #1e293b;
            border-left: 3px solid #475569;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
        }
        .audit-entry.success { border-left-color: #10b981; }
        .audit-entry.error { border-left-color: #ef4444; }
        .audit-entry.warning { border-left-color: #f59e0b; }
        .audit-timestamp { color: #94a3b8; }
        .audit-event { color: #38bdf8; font-weight: 600; }
        .refresh-button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .refresh-button:hover { background: #2563eb; }
        .refresh-button:active { transform: scale(0.95); }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            gap: 30px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #38bdf8;
        }
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Failover Gateway Status</h1>
            </div>
            <button class="refresh-button" onclick="refreshStatus()">↻ Refresh</button>
        </div>

        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-value" id="healthy-count">-</div>
                <div class="stat-label">Healthy</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="degraded-count">-</div>
                <div class="stat-label">Degraded</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="unhealthy-count">-</div>
                <div class="stat-label">Down</div>
            </div>
        </div>

        <h2 style="margin-top: 40px; margin-bottom: 20px;">Endpoints</h2>
        <div class="grid" id="endpoints-container">
            <div class="loading">Loading endpoint status...</div>
        </div>

        <h2 style="margin-top: 40px; margin-bottom: 20px;">Audit Log</h2>
        <div class="audit-log" id="audit-log">
            <div class="loading">Loading audit log...</div>
        </div>
    </div>

    <script>
        const GATEWAY_STATUS_URL = '/api/v1/gateway/status';
        const REFRESH_INTERVAL = 10000; // 10 seconds

        async function refreshStatus() {
            try {
                const response = await fetch(GATEWAY_STATUS_URL);
                const data = await response.json();

                if (data.endpoints) {
                    updateEndpointsDisplay(data.endpoints);
                }
                if (data.audit_log) {
                    updateAuditLogDisplay(data.audit_log);
                }

                // Update stats
                let healthy = 0, degraded = 0, unhealthy = 0;
                for (const [, endpoint] of Object.entries(data.endpoints || {})) {
                    if (endpoint.healthy) healthy++;
                    else if (endpoint.failure_count > 0 && endpoint.failure_count < 3) degraded++;
                    else unhealthy++;
                }
                document.getElementById('healthy-count').textContent = healthy;
                document.getElementById('degraded-count').textContent = degraded;
                document.getElementById('unhealthy-count').textContent = unhealthy;
            } catch (error) {
                console.error('Failed to fetch gateway status:', error);
            }
        }

        function updateEndpointsDisplay(endpoints) {
            const container = document.getElementById('endpoints-container');
            container.innerHTML = '';

            for (const [name, endpoint] of Object.entries(endpoints)) {
                const statusClass = endpoint.healthy ? 'status-healthy' :
                                   endpoint.failure_count > 0 ? 'status-degraded' : 'status-unhealthy';
                const statusText = endpoint.healthy ? 'Healthy' :
                                  endpoint.failure_count > 0 ? 'Degraded' : 'Down';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="endpoint-card">
                        <div class="endpoint-info">
                            <div class="endpoint-name">
                                <span class="status-indicator ${statusClass}"></span>
                                ${name.charAt(0).toUpperCase() + name.slice(1)}
                            </div>
                            <div class="endpoint-url">${endpoint.url}</div>
                        </div>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-value">
                                <span class="status-indicator ${statusClass}"></span>
                                ${statusText}
                            </div>
                            <div class="metric-label">Status</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${endpoint.failure_count}</div>
                            <div class="metric-label">Failures</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function updateAuditLogDisplay(auditLog) {
            const container = document.getElementById('audit-log');
            container.innerHTML = '';

            if (!auditLog || auditLog.length === 0) {
                container.innerHTML = '<div class="loading">No audit log entries</div>';
                return;
            }

            for (const entry of auditLog.reverse()) {
                const eventClass = entry.event_type.includes('success') ? 'success' :
                                  entry.event_type.includes('error') ? 'error' : 'warning';

                const div = document.createElement('div');
                div.className = `audit-entry ${eventClass}`;
                div.innerHTML = `
                    <div><span class="audit-timestamp">${entry.timestamp}</span>
                    <span class="audit-event">${entry.event_type}</span>
                    [${entry.endpoint}]</div>
                    <div style="margin-top: 5px; color: #cbd5e1;">${JSON.stringify(entry.details)}</div>
                `;
                container.appendChild(div);
            }
        }

        // Initial load
        refreshStatus();

        // Auto-refresh
        setInterval(refreshStatus, REFRESH_INTERVAL);
    </script>
</body>
</html>
