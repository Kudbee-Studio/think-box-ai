<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Think Jobs — status stream</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    .tj-wrap { padding: var(--space-6); max-width: 1100px; margin: 0 auto; }
    .tj-banner {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-bottom: var(--space-4);
      font-size: var(--text-sm);
      font-family: var(--font-mono);
      display: none;
    }
    .tj-banner.degraded { display: block; background: #2a2410; border: 1px solid #5c5030; color: var(--color-warning); }
    .tj-banner.error { display: block; background: #2a1820; border: 1px solid #5c3040; color: var(--color-danger); }
    .tj-grid { display: grid; grid-template-columns: 280px 1fr; gap: var(--space-4); }
    @media (max-width: 800px) { .tj-grid { grid-template-columns: 1fr; } }
    .tj-panel {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: var(--space-4);
    }
    .tj-list { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; }
    .tj-list li {
      padding: 0.45rem 0.5rem;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
    }
    .tj-list li.selected { background: var(--color-bg); }
    .tj-toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: var(--space-4); }
    .tj-toolbar input { font-family: var(--font-mono); font-size: var(--text-sm); padding: 0.35rem 0.5rem; }
    .tj-mode { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-tertiary); }
    .tj-mode.sse { color: var(--color-success); }
    .tj-mode.poll { color: var(--color-warning); }
    pre.tj-json {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.72rem;
      overflow: auto;
      max-height: 320px;
    }
    .tj-events { max-height: 200px; overflow: auto; font-family: var(--font-mono); font-size: 0.68rem; color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a href="/" class="nav-logo"><div class="nav-logo-icon">TB</div><span>Think Box</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Control Plane</a></li>
        <li><a href="think_job_status.html">Think Jobs</a></li>
        <li><a href="pipeline_dashboard.html">Pipeline</a></li>
        <li><a href="receipts.html">Receipts</a></li>
      </ul>
    </div>
  </nav>
  <main class="tj-wrap">
    <h1>Think Job status</h1>
    <p style="color: var(--color-text-secondary);">
      Subscribe to hermetic SSE deltas (#137) with automatic poll fallback. Evidence: simulated — not LIVE VERIFIED.
    </p>
    <div id="degradedBanner" class="tj-banner degraded"></div>
    <div id="errorBanner" class="tj-banner error"></div>
    <div class="tj-toolbar">
      <label>X-API-Key <input id="apiKey" type="password" placeholder="required for /api/v1" /></label>
      <label>Engine id <input id="engineId" type="text" placeholder="from POST /run" style="min-width:200px" /></label>
      <button id="btnWatch" style="padding:0.4rem 0.75rem;border-radius:4px;border:1px solid var(--color-border);cursor:pointer">Watch</button>
      <button id="btnStop" style="margin-left:0.5rem">Stop watch</button>
      <button id="btnRefreshList" style="margin-left:0.5rem">Refresh list</button>
      <span class="tj-mode" id="modeChip">mode: idle</span>
    </div>
    <div class="tj-grid">
      <aside class="tj-panel">
        <h2 style="font-size:var(--text-base);margin-top:0">Recent jobs</h2>
        <ul class="tj-list" id="jobList"></ul>
      </aside>
      <section class="tj-panel">
        <h2 style="font-size:var(--text-base);margin-top:0">Status</h2>
        <pre class="tj-json" id="statusOut">Select a job or enter engine id.</pre>
        <h3 style="font-size:var(--text-sm)">Stream events</h3>
        <div class="tj-events" id="eventLog"></div>
      </section>
    </div>
  </main>
  <script src="load_perf.js"></script>
  <script src="think_job_status_client.js"></script>
  <script>
    var watcher = null;
    var etagStore = {};
    var selectedEngine = null;

    function headers() {
      return TBThinkJobStatus.apiHeaders(document.getElementById("apiKey").value, "");
    }

    function logEvent(line) {
      var el = document.getElementById("eventLog");
      var row = document.createElement("div");
      row.textContent = new Date().toISOString() + " " + line;
      el.prepend(row);
      while (el.childNodes.length > 40) el.removeChild(el.lastChild);
    }

    function setMode(mode) {
      var chip = document.getElementById("modeChip");
      chip.textContent = "mode: " + mode;
      chip.className = "tj-mode" + (mode === "sse" ? " sse" : mode.indexOf("poll") >= 0 ? " poll" : "");
      var deg = document.getElementById("degradedBanner");
      if (mode === "degraded_poll" || mode === "poll") {
        deg.style.display = "block";
        deg.textContent = mode === "degraded_poll"
          ? "Degraded: SSE unavailable — polling GET /status (fail-closed on errors)."
          : "Poll fallback active (SSE ended or reconnecting).";
      } else if (mode === "sse") {
        deg.style.display = "none";
      } else {
        deg.style.display = "none";
      }
    }

    function showError(msg) {
      var el = document.getElementById("errorBanner");
      if (!msg) { el.style.display = "none"; return; }
      el.style.display = "block";
      el.textContent = msg;
    }

    function renderStatus(watch) {
      document.getElementById("statusOut").textContent = JSON.stringify(watch.summary, null, 2);
    }

    async function refreshJobList() {
      var list = document.getElementById("jobList");
      list.innerHTML = "<li>Loading…</li>";
      try {
        var result = await TBLoadPerf.fetchJsonConditional(
          "/api/v1/run/jobs/status?limit=30&detail=summary",
          { headers: headers() },
          etagStore
        );
        var jobs = result.data.jobs || [];
        list.innerHTML = "";
        jobs.forEach(function (row) {
          var li = document.createElement("li");
          var eid = row.engine_id || row.job_id;
          li.textContent = (eid || "?") + " — " + (row.status || "?");
          if (eid === selectedEngine) li.classList.add("selected");
          li.onclick = function () {
            document.getElementById("engineId").value = eid;
            startWatch(eid);
          };
          list.appendChild(li);
        });
        if (!jobs.length) list.innerHTML = "<li>No jobs in dashboard state</li>";
      } catch (e) {
        list.innerHTML = "<li>Error: " + e + "</li>";
        showError(String(e));
      }
    }

    function startWatch(engineId) {
      if (!engineId) return;
      selectedEngine = engineId;
      showError("");
      if (watcher) watcher.stop();
      watcher = new TBThinkJobStatus.ThinkJobStatusWatcher({
        apiKey: document.getElementById("apiKey").value,
        etagStore: etagStore,
        onUpdate: function (watch, ev) {
          renderStatus(watch);
          logEvent((ev.kind || "update") + " seq=" + (watch.lastSequence || 0));
        },
        onModeChange: function (mode) { setMode(mode); },
        onError: function (err) {
          logEvent("error: " + err);
          showError(String(err));
        },
      });
      watcher.watchEngine(engineId).catch(function (e) {
        showError(String(e));
      });
      refreshJobList();
    }

    document.getElementById("btnWatch").onclick = function () {
      startWatch(document.getElementById("engineId").value.trim());
    };
    document.getElementById("btnStop").onclick = function () {
      if (watcher) watcher.stop();
      setMode("idle");
      logEvent("watch stopped");
    };
    document.getElementById("btnRefreshList").onclick = refreshJobList;
    refreshJobList().catch(function () {});
  </script>
</body>
</html>
