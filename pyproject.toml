[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "think-box-ai"
version = "0.5.0"
description = "Think Box AI — Agent Execution Environment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.9.6",
    "mypy==1.14.1",
    "bandit==1.8.2",
]
lint = [
    "ruff==0.9.6",
    "mypy==1.14.1",
    "bandit==1.8.2",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
think-box-ai = "think_box_ai.cli:main"
thinkbox = "think_box_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = [
    "thinkbox/beyond_kilo_lint.py",
    "thinkbox/kilo_beyond_kilo_lint.py",
]
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = true

[tool.bandit]
exclude_dirs = ["tests", "experiments", "data"]
skips = ["B101"]

[tool.setuptools.packages.find]
where = ["."]
include = ["think_box_ai*"]

[tool.thinkbox]
default_provider = "openai_compat"
default_model = "gpt-4o-mini"
max_think_box_depth = 2
audit_log_retention_days = 90
