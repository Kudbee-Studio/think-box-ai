[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "think-box-ai"
version = "0.5.0"
description = "Think Box AI — Agent Execution Environment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "aiohttp>=3.14.3",
    "websockets>=16.1.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx2>=2.13",  # fastapi/starlette TestClient; backend tests cannot be collected without it
    "ruff==0.16.9",
    "mypy==2.3.1",
    "bandit==1.9.4",
]
lint = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "bandit==1.9.4",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx2>=2.13",  # fastapi/starlette TestClient; backend tests cannot be collected without it
]

[project.scripts]
think-box-ai = "think_box_ai.cli:main"
thinkbox = "think_box_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
    "data/",
    "experiments/",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "S",      # flake8-bandit (security)
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TRY",    # tryceratops
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
]
ignore = [
    "E501",    # line-too-long
    "S101",    # use-of-assert (acceptable in tests)
    "S603",    # subprocess-without-shell-equals-true
    "PT011",   # pytest-raises-too-broad
    "TRY003",  # raise-vanilla-args
    "SIM105",  # unnecessary-else-after-return
    "BLE001",  # blind-except
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S607"]
"scripts/**" = ["S603", "S607"]
"experiments/**" = ["S603", "S607", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["thinkbox", "core", "backend", "think_box_ai"]

[tool.mypy]
python_version = "3.10"
files = [
    "thinkbox/beyond_kilo_lint.py",
    "thinkbox/kilo_beyond_kilo_lint.py",
]
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = true

[tool.bandit]
exclude_dirs = ["tests", "experiments", "data"]
skips = ["B101"]

[tool.setuptools.packages.find]
where = ["."]
include = ["think_box_ai*"]

[tool.thinkbox]
default_provider = "openai_compat"
default_model = "gpt-4o-mini"
max_think_box_depth = 2
audit_log_retention_days = 90
