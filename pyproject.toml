[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "think-box-ai"
version = "0.2.0"
description = "Think Box AI — Think Job control plane and CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
think-box-ai = "think_box_ai.cli:main"
thinkbox = "think_box_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["think_box_ai*", "think_box_ai.commands*", "think_box_ai.ui*", "think_box_ai.utils*"]

[tool.thinkbox]
default_provider = "openai_compat"
default_model = "gpt-4o-mini"
max_think_box_depth = 2
audit_log_retention_days = 90
