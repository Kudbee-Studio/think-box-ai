<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>kudbEE Simple</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { margin: 0; padding: 0; }
    .simple-container { max-width: 800px; margin: 40px auto; padding: 20px; }
    .input-area { display: flex; gap: 10px; margin: 20px 0; }
    #goal { flex: 1; padding: 10px; font-size: 14px; }
    button { padding: 10px 20px; background: #4caf50; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:disabled { background: #ccc; }
    .output { background: #f5f5f5; padding: 15px; border-radius: 4px; margin: 20px 0; min-height: 100px; }
    .error { color: red; }
    .success { color: green; }
    .loading { color: #666; font-style: italic; }
    h1 { color: #333; }
  </style>
</head>
<body>
  <div class="simple-container">
    <h1>🐝 kudbEE — Simple Interface</h1>
    <p>Model: <strong>smollm2:135m</strong> (via Ollama)</p>

    <div class="input-area">
      <input type="text" id="goal" placeholder="Ask me something..." />
      <button id="submit" onclick="executeGoal()">Run</button>
    </div>

    <div class="output" id="output">
      <p class="loading">Ready to execute. Type something above and click Run.</p>
    </div>
  </div>

  <script>
    async function executeGoal() {
      const input = document.getElementById('goal');
      const goal = input.value.trim();
      if (!goal) return;

      const output = document.getElementById('output');
      const btn = document.getElementById('submit');

      output.innerHTML = '<p class="loading">⏳ Processing with model...</p>';
      btn.disabled = true;
      input.disabled = true;

      try {
        // Construct the URL carefully
        const protocol = window.location.protocol;
        const hostname = window.location.hostname;
        const port = window.location.port;
        const baseUrl = `${protocol}//${hostname}${port ? ':' + port : ''}`;
        const apiUrl = `${baseUrl}/api/execute`;

        console.log('Fetching from:', apiUrl);

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ goal })
        });

        console.log('Response status:', response.status);

        if (!response.ok) {
          throw new Error(`Server returned ${response.status}`);
        }

        const data = await response.json();

        if (data.success) {
          output.innerHTML = `<p class="success">✓ Model says:</p><p>${data.result}</p>`;
        } else {
          output.innerHTML = `<p class="error">✗ Error: ${data.error}</p>`;
        }
      } catch (err) {
        console.error('Full error:', err);
        output.innerHTML = `<p class="error">✗ ${err.message}</p>`;
      } finally {
        btn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    document.getElementById('goal').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeGoal();
    });
  </script>
</body>
</html>
