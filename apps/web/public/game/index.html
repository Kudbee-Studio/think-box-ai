<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Starfall</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <div class="stage">
      <canvas id="game" aria-label="Starfall game" tabindex="-1"></canvas>
      <input id="initials" maxlength="3" autocomplete="off" spellcheck="false" aria-label="Your initials for the high-score table" placeholder="AAA" hidden>
    </div>
    <div class="bar"><button id="mute" type="button" aria-pressed="false">Sound on</button><span id="difficulty" class="difficulty-bar" role="group" aria-label="Difficulty"></span></div>
    <div class="touch" aria-hidden="true">
      <button data-touch="left" tabindex="-1">◀</button>
      <button data-touch="fire" tabindex="-1">Fire</button>
      <button data-weapon tabindex="-1">Weapon</button>
      <button data-bomb tabindex="-1">Bomb</button>
      <button data-touch="right" tabindex="-1">▶</button>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
