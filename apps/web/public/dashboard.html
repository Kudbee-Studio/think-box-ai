<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUDBEE - Think Box AI</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: #2a2a3a;
            --text: #e0e0e0;
            --text-dim: #888;
            --accent: #00d4aa;
            --accent-dim: #00a88a;
            --danger: #ff4444;
            --warning: #ffaa00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        .logo span { color: var(--text); }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .main { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 52px); }
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1rem;
            overflow-y: auto;
        }
        .content { padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
        }
        .card h3 { color: var(--accent); margin-bottom: 0.75rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .box-item {
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            border-radius: 4px;
        }
        .box-item:hover { background: rgba(0, 212, 170, 0.1); }
        .box-item:last-child { border-bottom: none; }
        .state { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; float: right; }
        .state.created { background: #333; color: var(--text); }
        .state.executing { background: var(--warning); color: #000; }
        .state.complete { background: var(--accent); color: #000; }
        .state.failed { background: var(--danger); color: #fff; }
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .btn:hover { background: var(--accent-dim); }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        .input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem;
            border-radius: 4px;
            width: 100%;
            font-family: inherit;
        }
        .terminal {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1rem;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            color: #00d4aa;
        }
        .terminal-line { margin: 0; line-height: 1.4; }
        .metric { display: inline-block; margin-right: 1.5rem; }
        .metric-value { color: var(--accent); font-weight: bold; font-size: 1.1rem; }
        .metric-label { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; }
        .flex-row { display: flex; gap: 0.5rem; align-items: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .token-tag {
            display: inline-block;
            background: rgba(0, 212, 170, 0.15);
            color: var(--accent);
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-size: 0.7rem;
            margin-right: 0.25rem;
        }
        .live-indicator {
            font-size: 0.65rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">KUDBEE<span>·AI</span></div>
        <div class="flex-between" style="gap:1rem;">
            <span class="live-indicator"><span class="status-dot"></span>LIVE</span>
            <button class="btn btn-sm" onclick="refreshData()">Refresh</button>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="card">
                <div class="flex-between" style="margin-bottom:0.5rem;">
                    <h3>Think Boxes</h3>
                    <span id="box-count" class="token-tag">0</span>
                </div>
                <div id="boxes-list"></div>
            </div>
            <div class="card">
                <h3>Create New</h3>
                <input type="text" class="input" id="goal-input" placeholder="Goal..." onkeydown="if(event.key==='Enter')createBox()">
                <button class="btn" style="width:100%; margin-top:0.5rem;" onclick="createBox()">Create</button>
            </div>
        </div>
        <div class="content">
            <div class="card">
                <h3>Agent Execution</h3>
                <div class="flex-row" style="margin-bottom:0.75rem;">
                    <input type="text" class="input" id="exec-input" placeholder="Enter command..." onkeydown="if(event.key==='Enter')runExec()">
                    <button class="btn" onclick="runExec()">Run</button>
                </div>
                <div class="terminal" id="exec-terminal">Ready...</div>
            </div>
            <div class="card">
                <div class="flex-between">
                    <h3>System Metrics</h3>
                </div>
                <div style="display:flex; gap:2rem; flex-wrap:wrap;">
                    <div class="metric">
                        <div class="metric-value" id="m-boxes">0</div>
                        <div class="metric-label">Boxes</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="m-tokens">0</div>
                        <div class="metric-label">Tokens</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="m-executions">0</div>
                        <div class="metric-label">Executions</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="m-score">—</div>
                        <div class="metric-label">Avg Score</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>Selected Box</h3>
                <div id="box-details">Select a box from the sidebar</div>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        let selectedBox = null;

        async function api(path, opts = {}) {
            const res = await fetch(API + path, {
                headers: { 'Content-Type': 'application/json' },
                ...opts,
            });
            return res.json();
        }

        // SSE for live updates
        function connectSSE() {
            const es = new EventSource(API + '/api/stream');
            es.addEventListener('box_created', (e) => {
                const data = JSON.parse(e.data);
                appendTerminal(`[box created] ${data.id}`);
                refreshData();
            });
            es.addEventListener('exec_output', (e) => {
                const data = JSON.parse(e.data);
                if (selectedBox && data.box_id === selectedBox) {
                    appendTerminal(data.chunk, false);
                }
            });
            es.addEventListener('exec_complete', (e) => {
                const data = JSON.parse(e.data);
                appendTerminal(`\n[exit code: ${data.code}]`);
                refreshData();
            });
        }

        function appendTerminal(text, newline = true) {
            const term = document.getElementById('exec-terminal');
            const span = document.createElement('span');
            span.className = 'terminal-line';
            span.textContent = text + (newline ? '\n' : '');
            term.appendChild(span);
            term.scrollTop = term.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('exec-terminal').innerHTML = '';
        }

        async function refreshData() {
            try {
                const boxes = await api('/api/boxes');
                renderBoxes(boxes.boxes);
                document.getElementById('m-boxes').textContent = boxes.boxes.length;
                document.getElementById('box-count').textContent = boxes.boxes.length;
            } catch (e) {
                console.error('Refresh failed:', e);
            }
        }

        function renderBoxes(boxes) {
            const el = document.getElementById('boxes-list');
            if (!boxes || boxes.length === 0) {
                el.innerHTML = '<p style="color:var(--text-dim);font-size:0.8rem">No boxes yet</p>';
                return;
            }
            el.innerHTML = boxes.map(b => `
                <div class="box-item" onclick="selectBox('${b}')">
                    ${b.slice(0, 18)}...
                </div>
            `).join('');
        }

        async function selectBox(id) {
            selectedBox = id;
            const box = await api(`/api/boxes/${id}`);
            document.getElementById('box-details').innerHTML = `
                <p><strong>ID:</strong> ${id}</p>
                <p><strong>Tokens:</strong> ${box.tokens?.length || 0}</p>
            `;
        }

        async function createBox() {
            const goal = document.getElementById('goal-input').value;
            if (!goal) return;
            await api('/api/boxes', { method: 'POST', body: JSON.stringify({ goal }) });
            document.getElementById('goal-input').value = '';
            refreshData();
        }

        async function runExec() {
            const cmd = document.getElementById('exec-input').value;
            if (!cmd) return;
            clearTerminal();
            appendTerminal(`$ ${cmd}\n`);

            if (!selectedBox) {
                appendTerminal('[error: select a box first]');
                return;
            }

            try {
                const res = await api(`/api/boxes/${selectedBox}/exec`, {
                    method: 'POST',
                    body: JSON.stringify({ command: cmd }),
                });
                document.getElementById('exec-input').value = '';
            } catch (e) {
                appendTerminal(`[error: ${e.message}]`);
            }
        }

        // Init
        refreshData();
        connectSSE();
    </script>
</body>
</html>
