<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUDBEE — Think Box AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: #2a2a3a;
            --text: #e0e0e0;
            --text-dim: #666;
            --accent: #00d4aa;
            --accent-dim: #00a88a;
            --danger: #ff4444;
            --warning: #ffaa00;
            --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
        }
        .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .logo span { color: var(--text); opacity: 0.7; }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--text-dim); }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s infinite;
        }
        .status-dot.disconnected { background: var(--danger); animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .main { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 48px); }
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.75rem;
        }
        .card h3 {
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        .box-item {
            padding: 0.4rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }
        .box-item:hover { background: rgba(0, 212, 170, 0.1); }
        .box-item.active { background: rgba(0, 212, 170, 0.15); border-left: 2px solid var(--accent); }
        .terminal-container { display: flex; flex-direction: column; height: 100%; }
        .terminal-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .terminal-title { font-size: 0.8rem; color: var(--text-dim); }
        .terminal-wrapper { flex: 1; padding: 0.5rem; overflow: hidden; }
        .#terminal { width: 100%; height: 100%; }
        .input-row {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 0.75rem 1rem;
            display: flex;
            gap: 0.5rem;
        }
        .input-row input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }
        .input-row input:focus { outline: none; border-color: var(--accent); }
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .btn:hover { background: var(--accent-dim); }
        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }
        .metrics { display: flex; gap: 1.5rem; }
        .metric-value { color: var(--accent); font-weight: bold; font-size: 1rem; }
        .metric-label { color: var(--text-dim); font-size: 0.65rem; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">KUDBEE<span>·AI</span></div>
        <div class="header-right">
            <div class="metrics">
                <div>
                    <div class="metric-value" id="m-boxes">0</div>
                    <div class="metric-label">Boxes</div>
                </div>
                <div>
                    <div class="metric-value" id="m-tokens">0</div>
                    <div class="metric-label">Tokens</div>
                </div>
            </div>
            <div class="status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
                    <h3>Think Boxes</h3>
                    <span id="box-count" style="color:var(--accent);font-size:0.7rem">0</span>
                </div>
                <div id="boxes-list"></div>
            </div>
            <div class="card">
                <h3>Create New</h3>
                <input type="text" id="goal-input" placeholder="Enter goal..." style="width:100%;margin-bottom:0.5rem;">
                <button class="btn" style="width:100%" onclick="createBox()">Create Box</button>
            </div>
        </div>
        <div class="terminal-container">
            <div class="terminal-header">
                <span class="terminal-title" id="terminal-title">Terminal — Select a box</span>
                <div style="display:flex;gap:0.5rem;">
                    <button class="btn btn-secondary" onclick="clearTerminal()">Clear</button>
                    <button class="btn" onclick="runAgentDemo()">Run Demo</button>
                </div>
            </div>
            <div class="terminal-wrapper">
                <div id="terminal"></div>
            </div>
            <div class="input-row">
                <input type="text" id="cmd-input" placeholder="Enter command..." onkeydown="if(event.key==='Enter')runCommand()">
                <button class="btn" onclick="runCommand()">Execute</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script>
        const API = window.location.origin;
        let selectedBox = null;
        let term, fitAddon;

        // ─── Terminal Setup ─────────────────────────────────────
        function initTerminal() {
            term = new Terminal({
                cursorBlink: true,
                fontSize: 13,
                fontFamily: "'Menlo', 'Monaco', 'Courier New', monospace",
                scrollback: 10000,
                theme: {
                    background: '#0a0a0f',
                    foreground: '#00d4aa',
                    cursor: '#00d4aa',
                    selection: 'rgba(0, 212, 170, 0.3)',
                    black: '#0a0a0f',
                    red: '#ff4444',
                    green: '#00d4aa',
                    yellow: '#ffaa00',
                    blue: '#4488ff',
                    magenta: '#ff44ff',
                    cyan: '#44ffff',
                    white: '#e0e0e0',
                }
            });
            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById('terminal'));
            fitAddon.fit();
            window.addEventListener('resize', () => fitAddon.fit());
            term.writeln('\x1b[32m✓ KUDBEE Terminal Ready\x1b[0m');
            term.writeln('\x1b[90mSelect a box and enter commands to begin.\x1b[0m\n');
        }

        function writeTerminal(text) {
            if (term) term.write(text);
        }

        function clearTerminal() {
            if (term) term.clear();
        }

        // ─── SSE Connection ─────────────────────────────────────
        function connectSSE() {
            const es = new EventSource(API + '/api/stream');
            const dot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            es.onopen = () => {
                dot.classList.remove('disconnected');
                statusText.textContent = 'Live';
            };
            es.onerror = () => {
                dot.classList.add('disconnected');
                statusText.textContent = 'Reconnecting...';
            };
            es.addEventListener('box_created', (e) => {
                const data = JSON.parse(e.data);
                writeTerminal(`\x1b[33m[box created] ${data.id}\x1b[0m\n`);
                refreshData();
            });
            es.addEventListener('exec_output', (e) => {
                const data = JSON.parse(e.data);
                writeTerminal(data.chunk);
            });
            es.addEventListener('exec_complete', (e) => {
                const data = JSON.parse(e.data);
                writeTerminal(`\n\x1b[33m[exit: ${data.code}]\x1b[0m$ `);
                refreshData();
            });
        }

        // ─── API Helpers ────────────────────────────────────────
        async function api(path, opts = {}) {
            const res = await fetch(API + path, {
                headers: { 'Content-Type': 'application/json' },
                ...opts,
            });
            return res.json();
        }

        // ─── Box Management ─────────────────────────────────────
        async function refreshData() {
            try {
                const boxes = await api('/api/boxes');
                renderBoxes(boxes.boxes);
                document.getElementById('m-boxes').textContent = boxes.boxes.length;
                document.getElementById('box-count').textContent = boxes.boxes.length;
            } catch (e) {
                console.error('Refresh failed:', e);
            }
        }

        function renderBoxes(boxes) {
            const el = document.getElementById('boxes-list');
            if (!boxes || boxes.length === 0) {
                el.innerHTML = '<p style="color:var(--text-dim);font-size:0.75rem">No boxes yet</p>';
                return;
            }
            el.innerHTML = boxes.map(b => `
                <div class="box-item ${b === selectedBox ? 'active' : ''}" onclick="selectBox('${b}')">
                    ${b.slice(0, 14)}...
                </div>
            `).join('');
        }

        async function selectBox(id) {
            selectedBox = id;
            document.getElementById('terminal-title').textContent = `Terminal — ${id.slice(0, 18)}`;
            writeTerminal(`\x1b[36m→ Selected: ${id}\x1b[0m\n`);
            renderBoxes((await api('/api/boxes')).boxes);
        }

        async function createBox() {
            const goal = document.getElementById('goal-input').value;
            if (!goal) return;
            await api('/api/boxes', { method: 'POST', body: JSON.stringify({ goal }) });
            document.getElementById('goal-input').value = '';
            refreshData();
        }

        // ─── Command Execution ──────────────────────────────────
        async function runCommand() {
            const cmd = document.getElementById('cmd-input').value;
            if (!cmd || !selectedBox) return;
            writeTerminal(`$ ${cmd}\n`);
            document.getElementById('cmd-input').value = '';

            try {
                await api(`/api/boxes/${selectedBox}/exec`, {
                    method: 'POST',
                    body: JSON.stringify({ command: cmd }),
                });
            } catch (e) {
                writeTerminal(`\x1b[31m[error: ${e.message}]\x1b[0m\n`);
            }
        }

        async function runAgentDemo() {
            const goal = document.getElementById('goal-input').value || 'echo Hello from KUDBEE';
            writeTerminal(`\n\x1b[36m═══ Running Agent Demo ═══\x1b[0m\n`);
            writeTerminal(`Goal: ${goal}\n`);

            const box = await api('/api/boxes', { method: 'POST', body: JSON.stringify({ goal }) });
            selectedBox = box.id;
            await selectBox(box.id);

            await api(`/api/boxes/${box.id}/exec`, {
                method: 'POST',
                body: JSON.stringify({ command: goal }),
            });

            writeTerminal(`\n\x1b[36m═══ Demo Complete ═══\x1b[0m\n`);
            refreshData();
        }

        // ─── Initialize ─────────────────────────────────────────
        initTerminal();
        connectSSE();
        refreshData();
    </script>
</body>
</html>
