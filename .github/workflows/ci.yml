name: Think Box AI CI/CD

on:
  push:
    branches: [main, 'session/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short

      - name: Run job validation
        run: python scripts/check_jobs.py

      - name: Check for secrets
        run: |
          git log -p --all | grep -E 'sk_|gsk_|password|secret' && echo "SECRETS FOUND" && exit 1 || echo "CLEAN"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m py_compile backend/main.py
          python -m py_compile core/database.py
          python -m py_compile core/security.py

      - name: Check JSON validity
        run: |
          find jobs/ -name "*.json" -exec python -m json.tool {} \; > /dev/null
          find data/ -name "*.json" -exec python -m json.tool {} \; > /dev/null

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t think-box-ai:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run --rm think-box-ai:${{ github.sha }} python -m pytest tests/unit/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: echo "Deploy step — configure for your infrastructure"
