name: test
# cursor/** push enables agent branch CI

on:
  push:
    branches: [main, "feat/**", "session/**", "cursor/**"]
  pull_request:

jobs:
  web-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Typecheck (TypeScript 7 native / tsgo)
        run: npm run typecheck
      - name: Agent OS tests (hermetic, mocked Inception)
        run: npm test
