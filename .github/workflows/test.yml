name: test
# cursor/** push enables agent branch CI

on:
  push:
    branches: [main, "feat/**", "session/**", "cursor/**"]
  pull_request:

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project dependencies
        run: pip install -e .
      - name: Run unit + integration tests
        run: python3 -m unittest discover -s tests -t .
      - name: KILO spine operator gates (hermetic, post-#150)
        run: |
          python3 scripts/verify_kilo_spine.py
          python3 scripts/verify_kilo_post_season_harden.py
          python3 scripts/verify_kilo_live_smoke_evidence.py
          python3 scripts/verify_kilo_live_smoke_operator.py
          python3 scripts/verify_kilo_control_plane_api.py
          python3 scripts/verify_kilo_receipt_chain_etag.py
          python3 scripts/verify_kilo_dashboard_receipt_chain_bind.py
          python3 scripts/verify_kilo_api_ops_harden.py
          python3 scripts/verify_kilo_end_link_deepen.py
          python3 scripts/verify_kilo_end_link_operator_ux.py
          python3 scripts/verify_kilo_receipt_chain_end_link_docs.py
          python3 scripts/verify_kilo_end_link_api_ops_harden.py
          python3 scripts/verify_kilo_receipt_chain_end_link_era_close.py
          python3 scripts/verify_kilo_control_plane_e2e_deepen.py
          python3 scripts/verify_kilo_governance_evidence_live_proof_readiness.py
          python3 scripts/verify_kilo_live_smoke_audit_flip_harden.py
          python3 scripts/verify_kilo_control_plane_post164_deepen.py
          python3 scripts/verify_kilo_receipt_chain_end_link_season_harden.py
          python3 scripts/verify_kilo_pr165_combined_harden.py
      - name: Secret scan (docs + repo hygiene)
        run: python3 scripts/scan_doc_secrets.py

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Typecheck (TypeScript 7 native / tsgo)
        run: npm run typecheck