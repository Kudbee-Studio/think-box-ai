name: test

on:
  push:
    branches: [main, "feat/**", "session/**"]
  pull_request:

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run unit + integration tests
        run: python3 -m unittest discover tests/ -v