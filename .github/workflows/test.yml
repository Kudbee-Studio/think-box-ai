name: test
# cursor/** push enables agent branch CI

on:
  push:
    branches: [main, "feat/**", "session/**", "cursor/**"]
  pull_request:

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project dependencies
        run: pip install -e .
      - name: Run unit + integration tests
        run: python3 -m unittest discover -s tests -t .
      - name: KILO fast spine verify (hermetic, post-#172)
        run: PYTHONUNBUFFERED=1 python3 -u scripts/verify_kilo_spine.py
      - name: Beyond-KILO lint execute (scoped ruff/mypy/bandit)
        run: |
          pip install -e ".[lint]"
          KILO_BEYOND_KILO_LINT_EXECUTE=1 python3 scripts/verify_kilo_beyond_kilo_lint.py
      - name: Think Job hermetic e2e deepen gate (PR #183)
        run: python3 scripts/verify_kilo_pr183_think_job_hermetic_e2e.py
      - name: Secret scan (docs + repo hygiene)
        run: python3 scripts/scan_doc_secrets.py

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Typecheck (TypeScript 7 native / tsgo)
        run: npm run typecheck
