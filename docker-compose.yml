services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      THINKBOX_DEFAULT_PROVIDER: ollama
      THINKBOX_DEFAULT_MODEL: llama3.1:8b
      THINKBOX_API_KEY: ${THINKBOX_API_KEY:?THINKBOX_API_KEY must be set}
      THINKBOX_RATE_LIMIT: "100"
      THINKBOX_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3000
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - full

  spine-verify:
    build:
      context: .
      dockerfile: Dockerfile.hermetic
    environment:
      PYTHONPATH: /app
    command: ["python3", "scripts/verify_docker_contract.py"]
    profiles:
      - hermetic

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-llm

volumes:
  ollama_data:
