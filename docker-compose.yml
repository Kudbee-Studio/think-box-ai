version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - THINKBOX_PROJECT_ROOT=.
      - THINKBOX_DEFAULT_PROVIDER=ollama
      - CORS_ORIGINS=*
      - ALLOWED_HOSTS=*
      - RATE_LIMIT=100
    volumes:
      - ./data:/app/data
      - ./jobs:/app/jobs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for caching
