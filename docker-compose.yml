version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - THINKBOX_DEFAULT_PROVIDER=ollama
      - THINKBOX_DEFAULT_MODEL=llama3.1:8b
      - THINKBOX_API_KEY=${THINKBOX_API_KEY:?THINKBOX_API_KEY must be set}
      - THINKBOX_RATE_LIMIT=100
      - THINKBOX_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-llm

volumes:
  ollama_data:
